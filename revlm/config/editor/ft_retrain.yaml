_name: ft_retrain
edit_lr: 1e-3
n_iter: 1000
retrain_memory: 100      # Max number of batches to keep in history for retraining
early_stop_patience: 20  # Stop training if loss doesn't decrease for N iterations
retrain_batch_size: 10    # Effective batch size for retrain (micro-batch grad accumulation over history)
